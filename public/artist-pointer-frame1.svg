<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180" fill="none">
  <defs>
    <filter id="lisaGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#lisaGlow1)">
    <!-- White Sticker Die-cut Border around Lisa -->
    <path d="M 68 12 Q 85 4 102 12 Q 120 22 122 45 Q 132 58 135 78 Q 135 98 126 114 L 140 148 Q 142 158 130 160 L 115 142 L 105 168 Q 92 172 82 165 L 75 145 L 55 165 Q 42 165 38 152 L 48 130 Q 32 120 32 95 Q 32 70 42 50 Q 48 24 68 12 Z" fill="#ffffff"/>

    <!-- Hair Back / Ponytail Flow -->
    <path d="M 46 45 C 38 65 35 95 44 125 C 46 112 50 85 52 70 Z" fill="#18181b"/>
    <path d="M 114 45 C 124 70 125 102 118 125 C 114 110 110 85 108 70 Z" fill="#18181b"/>

    <!-- Face & Neck -->
    <path d="M 60 70 L 60 90 Q 80 102 100 90 L 100 70 Z" fill="#fed7aa"/>
    <ellipse cx="80" cy="62" rx="26" ry="24" fill="#fed7aa"/>

    <!-- Lisa Signature Full Straight Bangs (หน้าม้าตรงไอคอนิกของลิซ่า) -->
    <!-- Hair Base Top -->
    <path d="M 50 48 C 50 20 62 14 80 14 C 98 14 110 20 110 48 C 102 46 95 46 80 46 C 65 46 58 46 50 48 Z" fill="#18181b"/>
    <!-- Full straight fringe / bangs covering forehead cleanly -->
    <rect x="54" y="44" width="52" height="15" rx="3" fill="#18181b"/>
    <path d="M 54 59 L 57 56 L 60 59 L 64 56 L 68 59 L 72 56 L 76 59 L 80 56 L 84 59 L 88 56 L 92 59 L 96 56 L 100 59 L 104 56 L 106 59" stroke="#18181b" stroke-width="2" stroke-linecap="round"/>
    <!-- Hair shine / highlight -->
    <path d="M 62 26 C 70 23 88 23 98 26" stroke="#52525b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Side Bangs Strands -->
    <path d="M 51 46 C 50 60 52 75 56 85 C 54 75 53 62 54 48 Z" fill="#18181b"/>
    <path d="M 109 46 C 110 60 108 75 104 85 C 106 75 107 62 106 48 Z" fill="#18181b"/>

    <!-- Eyes (Cat-eye liner with warm sparkle) -->
    <!-- Left Eye -->
    <path d="M 63 65 Q 69 60 74 65" stroke="#09090b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="68.5" cy="65.5" r="3.2" fill="#27272a"/>
    <circle cx="67.5" cy="64.5" r="1.2" fill="#ffffff"/>
    <path d="M 60 66 L 64 65" stroke="#09090b" stroke-width="2" stroke-linecap="round"/> <!-- Wing -->

    <!-- Right Eye -->
    <path d="M 86 65 Q 91 60 97 65" stroke="#09090b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="91.5" cy="65.5" r="3.2" fill="#27272a"/>
    <circle cx="90.5" cy="64.5" r="1.2" fill="#ffffff"/>
    <path d="M 97 65 L 100 66" stroke="#09090b" stroke-width="2" stroke-linecap="round"/> <!-- Wing -->

    <!-- Soft blush -->
    <circle cx="62" cy="72" r="5" fill="#fca5a5" opacity="0.6"/>
    <circle cx="98" cy="72" r="5" fill="#fca5a5" opacity="0.6"/>

    <!-- Pretty Confident Smile -->
    <path d="M 72 76 Q 80 84 88 76" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Chic Choker with star charm -->
    <rect x="70" y="86" width="20" height="4" rx="1.5" fill="#09090b"/>
    <polygon points="80,88 81.5,91 84,91 82,92.5 83,95 80,93.5 77,95 78,92.5 76,91 78.5,91" fill="#facc15"/>

    <!-- Rockstar Stage Jacket (Black with metallic pink/blue accents) -->
    <path d="M 52 96 L 108 96 L 118 140 L 42 140 Z" fill="#09090b"/>
    <!-- Jacket Lapels / Pink Collar trim -->
    <path d="M 58 96 L 74 125 L 80 96 Z" fill="#be185d"/>
    <path d="M 102 96 L 86 125 L 80 96 Z" fill="#be185d"/>
    <!-- Inner Top -->
    <polygon points="74,106 86,106 80,120" fill="#fbcfe8"/>
    <!-- Zipper & Silver Chain -->
    <line x1="80" y1="120" x2="80" y2="140" stroke="#e4e4e7" stroke-width="2"/>
    <circle cx="70" cy="118" r="1.8" fill="#facc15"/>
    <circle cx="90" cy="118" r="1.8" fill="#facc15"/>

    <!-- Left Arm & Hand Clinging/Resting onto Card Edge (เกาะขอบการ์ด) -->
    <path d="M 54 100 Q 42 110 46 128" stroke="#09090b" stroke-width="11" stroke-linecap="round"/>
    <!-- Hand gripping the card edge -->
    <path d="M 44 128 Q 40 136 48 142 Q 54 136 50 128 Z" fill="#fed7aa"/>
    <!-- Fingers curled over the card line -->
    <rect x="42" y="136" width="14" height="6" rx="3" fill="#fed7aa"/>
    <line x1="40" y1="140" x2="58" y2="140" stroke="#09090b" stroke-width="1.8" stroke-linecap="round"/> <!-- Grip crease -->

    <!-- Right Arm POINTING DOWN at Buy Button -->
    <path d="M 106 100 Q 120 114 116 130" stroke="#09090b" stroke-width="11" stroke-linecap="round"/>
    <!-- Forearm extending down -->
    <path d="M 116 130 L 126 150" stroke="#fed7aa" stroke-width="9" stroke-linecap="round"/>
    <!-- Hand & Pointing Finger -->
    <circle cx="126" cy="150" r="5.5" fill="#fed7aa"/>
    <!-- Long index finger pointing decisively down towards button -->
    <path d="M 126 150 L 130 166" stroke="#fed7aa" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Sparkling Star at the tip of finger -->
    <path d="M 132 172 L 132 178 M 129 175 L 135 175" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="132" cy="175" r="2" fill="#ffffff"/>
  </g>
</svg>