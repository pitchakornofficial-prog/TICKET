    <line x1="38" y1="140" x2="56" y2="140" stroke="#09090b" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Right Arm POINTING DOWN with active pulse -->
    <path d="M 106 100 Q 122 112 118 130" stroke="#09090b" stroke-width="11" stroke-linecap="round"/>
    <path d="M 118 130 L 128 152" stroke="#fed7aa" stroke-width="9" stroke-linecap="round"/>
    <circle cx="128" cy="152" r="5.5" fill="#fed7aa"/>
    <path d="M 128 152 L 132 168" stroke="#fed7aa" stroke-width="5.5" stroke-linecap="round"/>

