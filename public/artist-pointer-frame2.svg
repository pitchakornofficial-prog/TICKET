    <path d="M 44 45 C 36 65 33 95 42 125 C 44 112 48 85 50 70 Z" fill="#18181b"/>
    <path d="M 116 45 C 126 70 127 102 120 125 C 116 110 112 85 110 70 Z" fill="#18181b"/>

