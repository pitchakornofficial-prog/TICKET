    <path d="M 68 12 Q 85 4 102 12 Q 120 22 122 45 Q 132 58 135 78 Q 135 98 126 114 L 140 150 Q 142 160 130 162 L 115 144 L 105 168 Q 92 172 82 165 L 75 145 L 55 165 Q 42 165 38 152 L 48 130 Q 32 120 32 95 Q 32 70 42 50 Q 48 24 68 12 Z" fill="#ffffff"/>

