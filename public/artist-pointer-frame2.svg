    <line x1="138" y1="160" x2="146" y2="164" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="136" y1="172" x2="144" y2="176" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="133" cy="176" r="3" fill="#38bdf8"/>
