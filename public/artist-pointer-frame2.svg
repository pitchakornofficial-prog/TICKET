    <circle cx="62" cy="72" r="5.5" fill="#fca5a5" opacity="0.7"/>
    <circle cx="98" cy="72" r="5.5" fill="#fca5a5" opacity="0.7"/>

    <!-- Joyful Open Smile with teeth -->
    <path d="M 71 76 Q 80 88 89 76 Z" fill="#ffffff" stroke="#e11d48" stroke-width="2.2"/>

    <!-- Chic Choker with star charm -->
    <rect x="70" y="86" width="20" height="4" rx="1.5" fill="#09090b"/>
    <polygon points="80,88 81.5,91 84,91 82,92.5 83,95 80,93.5 77,95 78,92.5 76,91 78.5,91" fill="#facc15"/>

    <!-- Rockstar Stage Jacket -->
    <path d="M 52 96 L 108 96 L 118 140 L 42 140 Z" fill="#09090b"/>
    <path d="M 58 96 L 74 125 L 80 96 Z" fill="#e11d48"/>
    <path d="M 102 96 L 86 125 L 80 96 Z" fill="#e11d48"/>
