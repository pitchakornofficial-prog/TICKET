    <path d="M 63 65 Q 69 60 74 65" stroke="#09090b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="68.5" cy="65.5" r="3.2" fill="#27272a"/>
    <circle cx="67.5" cy="64.5" r="1.2" fill="#ffffff"/>
    <path d="M 60 66 L 64 65" stroke="#09090b" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Eye Playful Wink Star -->
    <path d="M 86 66 Q 92 70 98 66" stroke="#09090b" stroke-width="2.8" stroke-linecap="round"/>
