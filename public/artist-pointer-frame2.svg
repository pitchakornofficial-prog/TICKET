    <circle cx="70" cy="118" r="1.8" fill="#facc15"/>
    <circle cx="90" cy="118" r="1.8" fill="#facc15"/>

    <!-- Left Arm & Hand Clinging onto Card Edge -->
    <path d="M 54 100 Q 40 108 44 128" stroke="#09090b" stroke-width="11" stroke-linecap="round"/>
    <path d="M 42 128 Q 38 136 46 142 Q 52 136 48 128 Z" fill="#fed7aa"/>
