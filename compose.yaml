name: ticket-local
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket_local
      POSTGRES_DB: ticket_dev
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - dev-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket -d ticket_dev']
      interval: 2s
      timeout: 3s
      retries: 20
  db-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket_test_local
      POSTGRES_DB: ticket_test
    ports:
      - '127.0.0.1:55433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket -d ticket_test']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  dev-data:
